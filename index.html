<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Guitar Shell</title>
  <link rel="stylesheet" href="./css/layout.css">
  <!-- 网页标签图标 -->
  <link rel="icon" type="image/png" sizes="32x32" href="./icon-gShell-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-gShell-192.png">
  
  <!-- 苹果手机主屏幕图标 -->
  <link rel="apple-touch-icon" href="./icon-gShell-192.png">

  <!-- PWA 清单 -->
  <link rel="manifest" href="./manifest.json">
  
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="app-header">
    <div class="brand">🎸 Guitar Shell</div>
    <nav class="tabs">
      <button class="tab-btn active" data-target="view-metronome">节拍器</button>
      <button class="tab-btn" data-target="view-reader">读谱</button>
      <button class="tab-btn" data-target="view-log">记录</button>
      <button class="tab-btn" data-target="view-tuner">调音</button>
    </nav>
  </header>

  <!-- 核心工作区 -->
  <main class="app-main">
    <!-- 节拍器 -->
    <section id="view-metronome" class="view-section active">
      <guitar-metronome></guitar-metronome>
    </section>

    <!-- 读谱 -->
    <section id="view-reader" class="view-section">
      <guitar-sheet-reader></guitar-sheet-reader>
    </section>

    <!-- 🌟 练琴记录 -->
    <section id="view-log" class="view-section">
      <guitar-practice-log></guitar-practice-log>
    </section>

    <!-- 调音 -->
    <section id="view-tuner" class="view-section">
      <guitar-tuner></guitar-tuner>
    </section>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
